name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify distributions
        run: |
          python -m pip install build twine pytest duckdb
          python -m build
          python -m twine check --strict dist/*
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist').glob('*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])"
          python -m pip check
          python -I -m pytest
          python -I -m doctest README.md
      - name: Check package version against tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "from importlib.metadata import version; from os import environ; assert environ['GITHUB_REF_NAME'] == 'v' + version('h3d')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W -b html docs docs/_build/html
      - run: python -m sphinx -W -b doctest docs docs/_build/doctest
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: error
