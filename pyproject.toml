[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h3d"
version = "0.1.0"
description = "3D Extension for Uber H3 Spatial Indexing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["h3>=4.1,<5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/piglabsai/h3d"
Documentation = "https://piglabsai.github.io/h3d/"
Issues = "https://github.com/piglabsai/h3d/issues"
Changelog = "https://github.com/piglabsai/h3d/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["sphinx>=7.4,<9", "myst-parser>=3,<5", "sphinx-book-theme>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
